name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Instalar Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compilar ejecutable e instalador
        run: python tools/build.py

      - name: Empaquetar versión portable
        shell: pwsh
        run: |
          $version = python -c "import zubel; print(zubel.__version__)"
          Compress-Archive -Path dist/Zubel -DestinationPath "installer/Output/Zubel-$version-portable-win64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: zubel-windows
          path: installer/Output/*

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Output/*
          generate_release_notes: true
