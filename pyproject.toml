[project]
name = "zubel"
version = "1.0.0"
description = "Interfaz gráfica moderna para yt-dlp: descarga videos y audio en MP4, MP3 y más."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6"]

[project.gui-scripts]
zubel = "zubel.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["zubel*"]
